name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The React Native CLI is split across packages that require each other by
      # bare name, and react-native-macos resolves from app/node_modules. The
      # root install is what keeps that toolchain in one resolvable tree — see
      # the "//nohoist" note in the root package.json.
      - name: Install JS dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: app

      # React Native generates its Fabric sources into node_modules — notably
      # react-native-macos/ReactCommon/react/renderer/components/rncore, whose
      # absence makes the Fabric podspec fail the build with "Codegen did not
      # run properly". Those files ship in no tarball and survive no `npm ci`,
      # and pod install does not produce them for this workspace layout, so
      # codegen is run explicitly rather than relied on as a side effect.
      - name: Run React Native codegen
        run: >
          node node_modules/react-native-macos/scripts/generate-codegen-artifacts.js
          -p app -t ios -o app/macos/build/generated

      # Deliberately not cached: a restored Pods/ lets pod install skip work the
      # build still expects, and the generated sources above would go stale
      # against it. A clean install takes about a minute.
      - name: Install pods
        working-directory: app/macos
        run: bundle exec pod install

      # Temporary: report where rncore actually is, and what REACT_NATIVE_PATH
      # the podspec guard will resolve against.
      - name: Diagnose codegen output
        run: |
          echo "--- rncore under root node_modules ---"
          ls node_modules/react-native-macos/ReactCommon/react/renderer/components/rncore 2>&1 | head -5 || true
          echo "--- any rncore anywhere ---"
          find . -type d -name rncore -not -path '*/Pods/*' 2>/dev/null | head -10
          echo "--- REACT_NATIVE_PATH in generated xcconfig ---"
          grep -rh "REACT_NATIVE_PATH" app/macos/Pods/Target\ Support\ Files/ 2>/dev/null | sort -u | head -5

      # Unsigned: CI has no Apple Developer identity, and the artifact is for
      # local testing rather than distribution. Signing is switched off
      # explicitly so xcodebuild fails loudly on a real error instead of on a
      # missing certificate.
      - name: Build
        working-directory: app/macos
        run: |
          set -o pipefail
          # -quiet keeps the log to warnings and errors. xcodebuild otherwise
          # echoes every full clang invocation, which buries the one line that
          # says what actually failed.
          xcodebuild \
            -workspace PDFViewer.xcworkspace \
            -scheme PDFViewer-macOS \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Locate built app
        id: app
        run: |
          APP=$(find app/macos/build/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No .app produced" >&2
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      # Zipping preserves the bundle's symlinks and executable bits, which
      # upload-artifact would otherwise flatten into an unopenable directory.
      - name: Package
        run: ditto -c -k --keepParent "${{ steps.app.outputs.path }}" PDF-Viewer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Viewer-macOS
          path: PDF-Viewer-macOS.zip
          if-no-files-found: error
